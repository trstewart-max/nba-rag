name: nba-rag

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nba
      POSTGRES_PASSWORD: nba
      POSTGRES_DB: nba
    # 5433 on the host so this doesn't collide with a local Postgres on 5432.
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nba -d nba"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    build: .
    environment:
      DB_DSN: postgresql+psycopg://nba:nba@db:5432/nba
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      NBA_DATA_DIR: /app/data/kaggle
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nba_rag:/app/nba_rag
      - ./eval:/app/eval
      - ./data:/app/data
      - ./docs:/app/docs
    ports: ["8000:8000"]
    command: uvicorn nba_rag.server:app --host 0.0.0.0 --port 8000

volumes:
  pgdata:
